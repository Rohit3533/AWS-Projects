# QA Profile — Aurora MySQL on AWS
# Activate with: java -jar app.jar --spring.profiles.active=qa
# Or env var: SPRING_PROFILES_ACTIVE=qa

server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:mysql://your-aurora-cluster.cluster-xxxx.us-east-1.rds.amazonaws.com:3306/userdb}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
