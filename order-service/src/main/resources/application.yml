server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:h2:file:${H2_DATA_DIR:./data}/orderdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-dev-only-change-in-production-min32chars}
  expiration-ms: 86400000

payment:
  mode: ${PAYMENT_MODE:mock}
  real:
    gateway-url: ${PAYMENT_GATEWAY_URL:https://api.razorpay.com/v1}
    api-key: ${PAYMENT_API_KEY:}
    api-secret: ${PAYMENT_API_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Inter-service URLs (override via env vars in Docker / AWS)
services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
