name: Build and Push Microservices to ECR

on:
  push:
    branches:
      - develop
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Build All Services
      run: |

        cd user-service
        mvn clean install -DskipTests
        cd ..

        cd product-service
        mvn clean install -DskipTests
        cd ..

        cd order-service
        mvn clean install -DskipTests
        cd ..

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to ECR
      run: |
        aws ecr get-login-password \
        --region $AWS_REGION \
        | docker login \
        --username AWS \
        --password-stdin \
        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

    - name: Generate Image Tag
      run: |
        IMAGE_TAG=${GITHUB_SHA::7}
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Build and Push user-service
      run: |

        docker build \
        -t user-service:$IMAGE_TAG \
        ./user-service

        docker tag \
        user-service:$IMAGE_TAG \
        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/user-service:$IMAGE_TAG

        docker push \
        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/user-service:$IMAGE_TAG

    - name: Build and Push product-service
      run: |

        docker build \
        -t product-service:$IMAGE_TAG \
        ./product-service

        docker tag \
        product-service:$IMAGE_TAG \
        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/product-service:$IMAGE_TAG

        docker push \
        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/product-service:$IMAGE_TAG

    - name: Build and Push order-service
      run: |

        docker build \
        -t order-service:$IMAGE_TAG \
        ./order-service

        docker tag \
        order-service:$IMAGE_TAG \
        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/order-service:$IMAGE_TAG

        docker push \
        $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/order-service:$IMAGE_TAG
